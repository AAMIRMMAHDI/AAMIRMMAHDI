<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <style>
    @keyframes pulse {
      0%, 100% { r: 8; opacity: 0.3; }
      50% { r: 14; opacity: 1; }
    }
    circle:nth-child(1) { animation: pulse 1.4s ease-in-out infinite; }
    circle:nth-child(2) { animation: pulse 1.4s ease-in-out 0.2s infinite; }
    circle:nth-child(3) { animation: pulse 1.4s ease-in-out 0.4s infinite; }
    circle:nth-child(4) { animation: pulse 1.4s ease-in-out 0.6s infinite; }
  </style>
  <circle cx="40" cy="30" r="8" fill="#36BCF7" />
  <circle cx="80" cy="30" r="8" fill="#36BCF7" />
  <circle cx="120" cy="30" r="8" fill="#36BCF7" />
  <circle cx="160" cy="30" r="8" fill="#36BCF7" />
</svg>
