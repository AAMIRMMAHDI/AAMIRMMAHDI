<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <style>
    @keyframes pulseFade {
      0%   { transform: scale(1); opacity: 1; }
      70%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
    circle {
      animation: pulseFade 2.5s ease-out forwards;
      transform-origin: center;
    }
    circle:nth-child(1) { animation-delay: 0s; }
    circle:nth-child(2) { animation-delay: 0.15s; }
    circle:nth-child(3) { animation-delay: 0.3s; }
    circle:nth-child(4) { animation-delay: 0.45s; }
  </style>
  <circle cx="40" cy="30" r="10" fill="#36BCF7" />
  <circle cx="80" cy="30" r="10" fill="#36BCF7" />
  <circle cx="120" cy="30" r="10" fill="#36BCF7" />
  <circle cx="160" cy="30" r="10" fill="#36BCF7" />
</svg>
